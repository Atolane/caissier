<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="description" content="La Caissière la Plus Insupportable — simulation de caisse à la première personne : scannez, encaissez et soyez odieuse sans vous faire licencier.">
<title>La Caissière la Plus Insupportable</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>😒</text></svg>">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<canvas id="vue"></canvas>

<div id="hud">

  <!-- ligne du haut : jour et heure -->
  <div id="hud-haut">
    <span id="hud-jour">MARDI</span>
    <span id="hud-heure">09:00</span>
    <span id="hud-magasin">Supérette du Coin</span>
  </div>

  <!-- jauges discrètes en bas à gauche -->
  <div id="hud-jauges">
    <div class="jg" id="jg-mech"><span class="jg-lab"><b>😈</b><span>Désagréabilité</span></span><span class="jg-val">0 %</span><i></i></div>
    <div class="jg" id="jg-risk"><span class="jg-lab"><b>👔</b><span>Risque de licenciement</span></span><span class="jg-val">0 %</span><i></i></div>
    <div class="jg" id="jg-caisse"><span class="jg-lab"><b>💶</b><span>Caisse</span></span><span class="jg-val">0,00 €</span></div>
    <div class="jg mini" id="jg-rep"><span class="jg-lab"><b>⭐</b><span>Réputation</span></span><span class="jg-val">50</span><i></i></div>
    <div class="jg mini" id="jg-pat"><span class="jg-lab"><b>🧘</b><span>Patience</span></span><span class="jg-val">100</span><i></i></div>
    <div class="jg mini" id="jg-vit"><span class="jg-lab"><b>⚡</b><span>Vitesse</span></span><span class="jg-val">100</span><i></i></div>
    <div class="jg mini" id="jg-file"><span class="jg-lab"><b>👥</b><span>File</span></span><span class="jg-val">0</span></div>
  </div>

  <!-- viseur + libellé de l'objet visé -->
  <div id="viseur"><b></b><span id="viseur-txt"></span></div>

  <!-- bulle du client, ancrée au-dessus de sa tête -->
  <div id="bulle-client" class="hidden"><span id="bulle-client-nom"></span><span id="bulle-client-txt"></span></div>

  <!-- ce que répond la caissière -->
  <div id="bulle-caissiere" class="hidden"></div>

  <!-- annonces du magasin -->
  <div id="annonce" class="hidden"></div>

  <!-- messages courts -->
  <div id="toasts" aria-live="polite"></div>
  <div id="volants"></div>

  <!-- dialogues : réponses en bas -->
  <div id="zone-bas">
    <div id="titre-choix"></div>
    <div id="choix"></div>
  </div>

  <!-- actions de la caissière -->
  <div id="actions">
    <button class="act" data-act="soupir" title="Soupirer (S)">😮‍💨<b>2</b></button>
    <button class="act" data-act="yeux" title="Lever les yeux au ciel (Y)">🙄<b>2</b></button>
    <button class="act" data-act="pause" title="Pause imprévue (P)">🐌<b>1</b></button>
    <button class="act" data-act="prix" title="Contrôle de prix (C)">📢<b>1</b></button>
  </div>

  <!-- boutons système -->
  <div id="systeme">
    <button id="btn-son" title="Couper le son">🔊</button>
    <button id="btn-reglages" title="Réglages">⚙️</button>
    <button id="btn-menu" title="Menu (Échap)">☰</button>
  </div>

  <div id="aide-souris">Bougez la souris pour regarder · glissez pour pivoter · cliquez les objets</div>
</div>

<div id="overlay" class="hidden">
  <div id="overlay-box" role="dialog" aria-modal="true"></div>
</div>

<script src="js/vendor/three.min.js"></script>
<script src="js/audio.js"></script>
<script src="js/data.js"></script>
<script src="js/faces.js"></script>
<script src="js/scene3d.js"></script>
<script src="js/ui.js"></script>
<script src="js/engine.js"></script>
<script src="js/main.js"></script>
</body>
</html>
